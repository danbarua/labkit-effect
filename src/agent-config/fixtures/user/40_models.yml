# yaml-language-server: $schema=../../../../schemas/config.schema.json
#
# Models: the model that a new session asks, and what is known of models over models.dev's catalog.

# The model that a new session asks unless --model names another, as provider/model.
model: anthropic/claude-sonnet-5-5

# What is known of a model, by provider/model, over the catalog. A field given replaces the
# catalog's field whole; a field not given stays as the catalog has it. The fields: context,
# output, input (text, image, pdf), reasoning (true or false), efforts, and budget (min, max).
models:
  # Measured on 2026-10-01: xAI's models take effort minimal, and grok-4.5 takes xhigh, which
  # models.dev does not list.
  xai/grok-4.7:
    efforts: [minimal, low, medium, high, xhigh]
  xai/grok-4.6:
    efforts: [minimal, low, medium, high, xhigh]
  xai/grok-4.5:
    efforts: [minimal, low, medium, high, xhigh]
  # A model that the catalog does not know, served by the local server: set its context window and
  # output limit to what the server serves.
  localhost/qwen3.5-9b-8bit:
    context: 32768
    output: 8192
